name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m pytest -q native_build/scan_pipeline_20261030/test_pipeline.py native_build/pipeline_memory_20261030/test_memory_pipeline.py
      - run: python -m unittest discover -s native_build/resource_admission_20261102 -p 'test_*.py' -v
      - run: python -m pip wheel . --no-deps --wheel-dir /tmp/wheels
